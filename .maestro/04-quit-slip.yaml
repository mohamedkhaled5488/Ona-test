# E2E-005 Quit: ride out a craving (the timer runs while you pick a tool),
# then a hard day: marked on the journey with no shame, and the journey's day
# count carries on (no new chapter unless chosen).
appId: app.ona
tags:
  - core
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/open-habits.yaml
- tapOn: "Quit"
- tapOn: "Start quitting something"
- tapOn: "e.g. Smoking, nail biting, late-night scrolling"
- inputText: "late-night scrolling"
- hideKeyboard
- tapOn: "Start"
- extendedWaitUntil:
    visible: "I'm craving it"
    timeout: 10000
# A craving: a gentle timer, a tool, and how it went.
- tapOn: "I'm craving it"
- assertVisible: "You're doing something hard. Let's ride this out."
- tapOn: "Skip"
- assertVisible: 'Riding it out: \d+:\d\d'
- tapOn: "Breathe and ride it out"
- tapOn: "I'm okay now"
- tapOn: "It passed"
- assertVisible: "It passed"
- runFlow:
    when:
      visible: "Want to note how you're feeling?"
    commands:
      - tapOn: "Skip"
- tapOn: "Done"
# A hard day.
- tapOn: "I had a hard day"
- assertVisible: "Slips happen"
- assertNotVisible: ".*(You failed|failure|relapse|Relapse|start over from zero).*"
- tapOn: "Continue"
- assertVisible: "If you're up for it"
- tapOn: "Mark this hard day"
- assertVisible: "Marked on your journey"
- assertVisible: ".*Day 1 of your journey carries on.*"
- tapOn: "Back to my journey"
# The journey carries on: the same chapter, no reset.
- assertVisible: "Day 1 of your journey"
- assertNotVisible: "Track 2"
- scrollUntilVisible:
    element: "Track 1"
