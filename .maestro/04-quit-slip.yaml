# E2E-005 Quit journey with a slip: the tone stays kind, the chapter is
# saved, and a new track starts.
appId: app.ona
tags:
  - core
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/open-habits.yaml
- tapOn: "Quit"
- tapOn: "Start quitting something"
- tapOn: "e.g. Smoking, nail biting, late-night scrolling"
- inputText: "late-night scrolling"
- hideKeyboard
- tapOn: "Start"
- extendedWaitUntil:
    visible: "I went back to it"
    timeout: 10000
- tapOn: "I went back to it"
- assertVisible: "This isn't a failure"
- assertNotVisible: ".*(You failed|relapse|Relapse|start over from zero).*"
- tapOn: "Continue"
- assertVisible: "One more thing, if you're up for it"
- tapOn: "Save this chapter"
- assertVisible: "This chapter is saved"
- runFlow:
    when:
      visible: "Want to note how you're feeling?"
    commands:
      - tapOn: "Skip"
- tapOn: "Start a new track now"
- assertVisible: "Your journey"
- back
- assertVisible: ".*2 chapters so far.*"
