# Used by scripts/e2e-sleep.sh (not run on its own): a fresh Ona, Sleep,
# white noise with the shortest timer the build offers, playing. The new app
# has a custom length (1 min, 10 s fade); an older build only 15 min.
appId: app.ona
---
- runFlow: fresh-start.yaml
- tapOn: "Reflect"
- tapOn: "Sleep"
- scrollUntilVisible:
    element: "White noise"
- tapOn: "White noise"
- scrollUntilVisible:
    element: "Sleep timer"
- runFlow:
    when:
      visible: "Custom"
    commands:
      - tapOn: "Custom"
      - tapOn: "Minutes"
      - inputText: "1"
      - hideKeyboard
      - tapOn: "Set"
      - tapOn: "10 s"
- runFlow:
    when:
      notVisible: "Custom"
    commands:
      - tapOn: "15m"
# The button sits below the timer choices: off screen on a phone-sized emulator.
- scrollUntilVisible:
    element: "Play mix"
- tapOn: "Play mix"
- assertVisible: "Stop"
